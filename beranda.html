<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Utama - Website Elcida</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)), 
                        url('https://raw.githubusercontent.com/aanmaulanayasir37-droid/Website-elcida/main/images/1000246416.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .container {
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #e94560;
        }
        p {
            font-size: 14px;
            color: #dddddd;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }
        .btn-card {
            background-color: rgba(15, 52, 96, 0.85);
            color: white;
            border: 1px solid #e94560;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-card:hover {
            background-color: #e94560;
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
        .btn-back {
            display: inline-block;
            margin-top: 25px;
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
        }
        .btn-back:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Menu Utama</h1>
        <p>Selamat datang di Website Elcida! Silakan pilih menu di bawah ini untuk menjelajahi konten kami.</p>

        <div class="nav-grid">
            <a href="galeri.html" class="btn-card">
                🖼️ Galeri
            </a>
            <a href="cerita.html" class="btn-card">
                📖 Cerita
            </a>
            <a href="certs.html" class="btn-card">
                📜 Certs
            </a>
            <a href="index.html" class="btn-card">
                👤 Profil
            </a>
        </div>

        <a href="index.html" class="btn-back">⬅ Kembali ke Halaman Depan</a>
    </div>

</body>
</html>
