<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Elcida</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), 
                        url('https://raw.githubusercontent.com/aanmaulanayasir37-droid/Website-elcida/main/images/1000246416.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .card {
            background: rgba(22, 33, 62, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 480px;
            width: 92%;
        }
        .btn {
            border: none;
            padding: 10px 10px;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 4px 2px;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-discord {
            background-color: #5865F2;
            color: white;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.4);
        }
        .btn-danger {
            background-color: #e74c3c;
            color: white;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        }
        .btn-nav {
            background-color: rgba(15, 52, 96, 0.85);
            color: white;
            border: 1px solid #e94560;
        }
        .user-info {
            margin-top: 15px;
        }
        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 2px solid #e94560;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .menu-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-wrap: nowrap;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #dddddd;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="app-title" style="cursor: pointer; user-select: none;">Website Elcida</h1>
        <p id="welcome-text">Silahkan login menggunakan akun Discord.</p>

        <button id="login-btn" class="btn btn-discord" onclick="loginDiscord()">Login dengan Discord</button>

        <div id="user-profile" class="user-info" style="display: none;">
            <img id="user-avatar" class="avatar" src="" alt="Avatar">
            <h2 id="user-name" style="font-size: 18px; margin-bottom: 4px;"></h2>
            <p id="user-id" style="font-size: 12px; color: #aaa; margin-bottom: 10px;"></p>
            
            <div class="menu-container">
                <a href="beranda.html" class="btn btn-nav" target="_blank">Menu Utama</a>
                <a href="galeri.html" class="btn btn-nav">Galeri</a>
                <a href="cerita.html" class="btn btn-nav">Cerita</a>
                <a href="certs.html" class="btn btn-nav">Certs</a>
            </div>

            <button class="btn btn-danger" onclick="logout()" style="margin-top: 15px; width: 100%;">Logout</button>
        </div>
    </div>

    <script>
        const DISCORD_CLIENT_ID = "1547833891098730571";
        const REDIRECT_URI = "https://aanmaulanayasir37-droid.github.io/Website-elcida/";

        let clickCount = 0;
        document.getElementById('app-title').addEventListener('click', () => {
            clickCount++;
            if (clickCount === 3) {
                const code = prompt("Masukkan passcode rahasia:");
                if (code === "123") {
                    window.location.href = "developer.html";
                } else {
                    alert("Passcode salah!");
                }
                clickCount = 0;
            }
        });

        function loginDiscord() {
            const oauthUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            window.location.href = oauthUrl;
        }

        function showUserData(user) {
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('welcome-text').innerText = 'Selamat datang kembali!';
            document.getElementById('user-profile').style.display = 'block';
            document.getElementById('user-name').innerText = user.name;
            document.getElementById('user-id').innerText = `ID: ${user.id}`;
            document.getElementById('user-avatar').src = user.avatar;
        }

        function handleOAuth() {
            const savedUser = localStorage.getItem('elcida_user');
            if (savedUser) {
                showUserData(JSON.parse(savedUser));
                return;
            }

            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${accessToken}` }
                })
                .then(res => res.json())
                .then(response => {
                    const { username, discriminator, avatar, id } = response;
                    const avatarUrl = avatar 
                        ? `https://cdn.discordapp.com/avatars/${id}/${avatar}.png`
                        : `https://cdn.discordapp.com/embed/avatars/0.png`;

                    const userData = {
                        name: `${username}#${discriminator}`,
                        id: id,
                        avatar: avatarUrl
                    };

                    localStorage.setItem('elcida_user', JSON.stringify(userData));
                    showUserData(userData);
                    window.history.replaceState({}, document.title, window.location.pathname);
                })
                .catch(console.error);
            }
        }

        function logout() {
            localStorage.removeItem('elcida_user');
            window.location.reload();
        }

        window.onload = handleOAuth;
    </script>
</body>
</html>
